name: Collect free Gifts

on:
  schedule:
    # 03:43 UTC = 06:43 Arab Standard Time. Deliberately off the top of the
    # hour and ~1h early: GitHub queues scheduled runs and "0 5" is the most
    # contended slot (2026-08-04 ran 2h32m late), so this absorbs the drift.
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-gifts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm i
      - name: Claim gifts and update README.md
        run: npm run start
      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "abody2013mohd@gmail.com"
          git config --global user.name "WACNS"
          git add .
          DATE=$(date +'%m.%d')
          git diff --quiet && git diff --staged --quiet || (git commit -m "$DATE Rewards" && git push)
